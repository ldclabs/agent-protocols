# Required secrets for real publishing:
# - NPM_TOKEN
# - PYPI_API_TOKEN
# - CARGO_REGISTRY_TOKEN
name: Publish SDKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate publish commands without uploading packages"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SDK versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib

          root = pathlib.Path.cwd()
          npm_version = json.loads((root / "packages/agent-protocols/package.json").read_text())["version"]
          py_version = tomllib.loads((root / "python/agent-protocols/pyproject.toml").read_text())["project"]["version"]
          cargo_version = tomllib.loads((root / "crates/agent-protocols/Cargo.toml").read_text())["package"]["version"]

          versions = {
              "npm": npm_version,
              "python": py_version,
              "cargo": cargo_version,
          }
          if len(set(versions.values())) != 1:
              print(f"SDK versions must match before publishing: {versions}", file=sys.stderr)
              sys.exit(1)

          ref_type = os.environ.get("GITHUB_REF_TYPE")
          ref_name = os.environ.get("GITHUB_REF_NAME")
          expected_tag = f"v{npm_version}"
          if ref_type == "tag" and ref_name != expected_tag:
              print(f"Tag {ref_name} does not match SDK version {expected_tag}", file=sys.stderr)
              sys.exit(1)

          print(f"SDK version: {npm_version}")
          PY

      - name: Run TypeScript checks
        run: |
          pnpm -r test
          pnpm -r build

      - name: Run Python tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./python/agent-protocols
          python3 -m unittest discover -s python/agent-protocols/tests

      - name: Run Rust tests
        run: |
          rustup update --no-self-update stable
          cargo test --all-features

  publish-npm:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter agent-protocols build

      - name: Dry-run npm publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: packages/agent-protocols
        run: pnpm publish --dry-run --no-git-checks --access public

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: packages/agent-protocols
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks

  publish-pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install build twine
          python3 -m build python/agent-protocols
          python3 -m twine check python/agent-protocols/dist/*

      - name: Dry-run PyPI publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 -m twine check python/agent-protocols/dist/*

      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/agent-protocols/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-cargo:
    name: Publish Rust SDK to crates.io
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Rust toolchain
        run: rustup update --no-self-update stable

      - name: Dry-run cargo publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo publish -p agent-protocols --dry-run

      - name: Publish to crates.io
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p agent-protocols --token "$CARGO_REGISTRY_TOKEN"
