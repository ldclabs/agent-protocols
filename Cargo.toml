[workspace]
members = ["crates/agent-protocols"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ldclabs/agent-protocols"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2" }
getrandom = "0.4"
jsonschema = { version = "0.46", default-features = false }
rand = "0.10"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "gzip",
  "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha3 = "0.12"
thiserror = "2"
url = "2"
